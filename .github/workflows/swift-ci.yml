name: Swift CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: swift-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Swift 6.3
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.3'

      - name: Show Swift version
        run: swift --version

      - name: Build package
        run: swift build

      - name: Run test suite
        run: swift test
